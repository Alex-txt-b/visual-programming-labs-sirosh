version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_sirosh
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./local_data:/data

  redis:
    image: redis:alpine
    container_name: redis_sirosh
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data